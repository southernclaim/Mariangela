    <!-- Configuração de paleta de cores no Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#ffe4e6', // Rose 200
                            DEFAULT: '#9f1239', // Rose 800 - Vinho/Vermelho profundo
                            dark: '#4c0519', // Rose 950

    <style>
        body {
            background-color: #fffafb; /* Fundo levemente rosado/quente */
            color: #333;
        }

        /* Estilo para a grade estilo Pinterest (Masonry) */
        .masonry-grid {
            column-count: 1;
            column-gap: 1.5rem;
        }

        @media (min-width: 640px) {
            .masonry-grid { column-count: 2; }
        }

        @media (min-width: 1024px) {
            .masonry-grid { column-count: 3; }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        /* Efeitos de Hover nos s */
        .masonry-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(159, 18, 57, 0.2), 0 10px 10px -5px rgba(159, 18, 57, 0.1);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(76, 5, 25, 0.9) 0%, rgba(159, 18, 57, 0.4) 50%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            color: white;
        }

        .masonry-item:hover .overlay {
            opacity: 1;
        }

        .overlay-title {
            font-family: 'Lora', serif;
            font-size: 1.25rem;
            font-weight: 600;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }
        
        .overlay-desc {
            font-size: 0.875rem;
            font-style: italic;
            opacity: 0.8;
            transform: translateY(20px);
            transition: transform 0.4s ease;
            transition-delay: 0.1s;
        }

        .masonry-item:hover .overlay-title,
        .masonry-item:hover .overlay-desc {
            transform: translateY(0);
        }
        
        /* Animação suave na imagem */
        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 0.7s ease;
        }
        
        .masonry-item:hover img {
            transform: scale(1.05);
        }

        .secret-message {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .secret-message.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

    <script>
        const mariangelaTitle = document.getElementById('mariangelaTitle');
        const secretMessage = document.getElementById('secretMessage');
        let clickCount = 0;
        let secretTimeout;

        mariangelaTitle.addEventListener('click', (event) => {
            event.preventDefault();
            clickCount += 1;

            if (clickCount >= 10) {
                secretMessage.classList.add('show');

                clearTimeout(secretTimeout);
                secretTimeout = setTimeout(() => {
                    secretMessage.classList.remove('show');
                    clickCount = 0;
                }, 3000);
            }
        });

        // Efeito sutil de sombra na Navbar ao rolar a página
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 20) {
                nav.classList.add('shadow-sm');
                nav.classList.replace('py-4', 'py-2');
            } else {
                nav.classList.remove('shadow-sm');
                nav.classList.replace('py-2', 'py-4');
            }
        });
    </script>
